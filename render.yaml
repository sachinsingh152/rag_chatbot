services:
  - type: web
    name: agentic-rag
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATA_DIR
        value: /data
    disk:
      name: rag-data
      mountPath: /data
      sizeGB: 1
